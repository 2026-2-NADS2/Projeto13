<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo NI1 - Sobrevivência Espacial</title>
    <style>
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        body {
            background: #0b0b1a;
            color: #f2f2f2;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .tela {
            text-align: center;
        }

        h1 {
            letter-spacing: 4px;
            margin-bottom: 4px;
            color: #7CFC00;
        }

        .instrucoes {
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
        }

        .area-jogo {
            position: relative;
            width: 804px;
            margin: 0 auto;
            border: 2px solid #7CFC00;
        }

        canvas {
            background: #000;
            display: block;
        }

        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.82);
            padding: 24px;
        }

        #overlay.escondido {
            display: none;
        }

        #overlay-titulo {
            font-size: 44px;
            letter-spacing: 6px;
            color: #7CFC00;
            margin: 0;
        }

        #overlay.vitoria #overlay-titulo {
            color: #ffd633;
        }

        #overlay.derrota #overlay-titulo {
            color: #ff5050;
        }

        #overlay-texto {
            font-size: 17px;
            line-height: 1.6;
            color: #ddd;
            max-width: 520px;
        }

        #overlay-placar {
            font-size: 22px;
            color: #fff;
        }

        #overlay-botao {
            margin-top: 8px;
            padding: 12px 32px;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            background: #7CFC00;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #overlay-botao:hover {
            background: #a6ff4d;
        }

        .inimigo.basico { color: #ff5050; }
        .inimigo.rapido { color: #ffd633; }
        .inimigo.atirador { color: #c266ff; }

        #hud {
            display: flex;
            justify-content: space-between;
            width: 804px;
            margin: 8px auto 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="tela">
        <h1>Sobrevivência Espacial</h1>
        <div class="instrucoes">Use as setas. Evite os vermelhos. Apanhe os verdes para ganhar pontos. Chegue a 500 para VENCER!</div>
        
        <!-- Área principal do Jogo com o Canvas e o Overlay por cima -->
        <div class="area-jogo">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            
            <!-- Tela de Fim/Início de Jogo -->
            <div id="overlay" class="escondido">
                <h2 id="overlay-titulo"></h2>
                <p id="overlay-texto"></p>
                <div id="overlay-placar">Pontuação: <span id="placar-final">0</span></div>
                <button id="overlay-botao" onclick="reiniciarJogo()">Jogar Novamente</button>
            </div>
        </div>

        <!-- HUD (Painel inferior de pontuação) -->
        <div id="hud">
            <div>Pontuação Atual: <span id="hud-placar" style="color: #7CFC00; font-weight: bold;">0</span></div>
            <div>Objetivo: 500</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const overlay = document.getElementById('overlay');
        const overlayTitulo = document.getElementById('overlay-titulo');
        const overlayTexto = document.getElementById('overlay-texto');
        const placarFinal = document.getElementById('placar-final');
        const hudPlacar = document.getElementById('hud-placar');

        const teclas = {};
        window.addEventListener('keydown', (e) => teclas[e.code] = true);
        window.addEventListener('keyup', (e) => teclas[e.code] = false);

        class Entidade {
            constructor(x, y, largura, altura, cor) {
                this.x = x;
                this.y = y;
                this.largura = largura;
                this.altura = altura;
                this.cor = cor;
            }
            desenhar(ctx) {
                ctx.fillStyle = this.cor;
                ctx.fillRect(this.x, this.y, this.largura, this.altura);
            }
            atualizar() {}
        }

        class Jogador extends Entidade {
            constructor(x, y) {
                super(x, y, 30, 30, '#00ffcc'); 
                this.velocidade = 6;
            }
            atualizar() {
                if (teclas['ArrowLeft'] && this.x > 0) this.x -= this.velocidade;
                if (teclas['ArrowRight'] && this.x < canvas.width - this.largura) this.x += this.velocidade;
            }
        }

        class Inimigo extends Entidade {
            constructor(x, y, velocidade) {
                super(x, y, 20, 20, '#ff5050');
                this.velocidade = velocidade;
            }
            atualizar() { this.y += this.velocidade; }
        }

        class PowerUp extends Entidade {
            constructor(x, y) {
                super(x, y, 15, 15, '#7CFC00');
                this.velocidade = 3;
            }
            atualizar() { this.y += this.velocidade; }
        }

        let jogador = new Jogador(canvas.width / 2 - 15, canvas.height - 40);
        let inimigos = [];
        let powerups = [];
        let frameCount = 0;
        let jogoAtivo = true;
        let pontuacao = 0;
        const PONTOS_VITORIA = 500;

        function gerarEntidades() {
            if (frameCount % 50 === 0) {
                let x = Math.random() * (canvas.width - 20);
                inimigos.push(new Inimigo(x, -20, 2 + Math.random() * 3));
            }
            if (frameCount % 150 === 0) {
                let x = Math.random() * (canvas.width - 15);
                powerups.push(new PowerUp(x, -20));
            }
        }

        function verificarColisao(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.largura &&
                rect1.x + rect1.largura > rect2.x &&
                rect1.y < rect2.y + rect2.altura &&
                rect1.y + rect1.altura > rect2.y
            );
        }

        function fimDeJogo(venceu) {
            jogoAtivo = false;
            overlay.classList.remove('escondido');
            overlay.className = venceu ? 'vitoria' : 'derrota';
            
            overlayTitulo.innerText = venceu ? 'VITÓRIA!' : 'GAME OVER';
            overlayTexto.innerText = venceu ? 'Parabéns! Sobreviveu e atingiu o objetivo.' : 'A nave foi destruída por um bloco vermelho.';
            placarFinal.innerText = pontuacao;
        }

        function reiniciarJogo() {
            jogador.x = canvas.width / 2 - 15;
            inimigos = [];
            powerups = [];
            frameCount = 0;
            pontuacao = 0;
            hudPlacar.innerText = pontuacao;
            jogoAtivo = true;
            
            overlay.classList.add('escondido');
            overlay.className = '';
            
            loopJogo();
        }

        function loopJogo() {
            if (!jogoAtivo) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            jogador.atualizar();
            jogador.desenhar(ctx);

            gerarEntidades();

            for (let i = 0; i < inimigos.length; i++) {
                inimigos[i].atualizar();
                inimigos[i].desenhar(ctx);

                if (verificarColisao(jogador, inimigos[i])) {
                    fimDeJogo(false);
                }

                if (inimigos[i].y > canvas.height) {
                    inimigos.splice(i, 1);
                    i--;
                    pontuacao += 10; 
                    hudPlacar.innerText = pontuacao;
                }
            }

            for (let i = 0; i < powerups.length; i++) {
                powerups[i].atualizar();
                powerups[i].desenhar(ctx);

                if (verificarColisao(jogador, powerups[i])) {
                    powerups.splice(i, 1);
                    i--;
                    pontuacao += 50;
                    hudPlacar.innerText = pontuacao;
                } else if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                    i--;
                }
            }

            if (pontuacao >= PONTOS_VITORIA) {
                fimDeJogo(true);
            }

            frameCount++;
            requestAnimationFrame(loopJogo);
        }

        loopJogo();
    </script>
</body>
</html>
