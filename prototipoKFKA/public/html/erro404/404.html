<!-- ============================================================
     KFKA - Plataforma de Acompanhamento Escolar
     Tela: Página não encontrada (erro 404)
     Descrição: exibida quando o usuário acessa um endereço que não
     existe no sistema (link quebrado, endereço digitado errado ou
     tela ainda não criada). Atende ao requisito da Entrega 1 de
     "tratamento de rota inexistente".

     Quem mostra esta página é o servidor (server.js): a última
     rota do arquivo captura qualquer endereço que não foi
     atendido pelas anteriores e responde com este arquivo e com
     o código de status 404.
     ============================================================ -->

<!-- Declara que o documento usa HTML5. -->
<!DOCTYPE html>

<!-- Elemento raiz. lang="pt-br" informa o idioma do conteúdo. -->
<html lang="pt-br">

<head>
    <!-- Codificação UTF-8: garante acentos e "ç" corretos. -->
    <meta charset="UTF-8">

    <!-- Base da responsividade: largura real da tela, sem zoom inicial. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Texto da aba do navegador. Começar pelo erro ajuda o usuário
         a entender o que houve só de olhar a aba. -->
    <title>Página não encontrada | KFKA</title>
</head>

<body>

    <!-- <main>: conteúdo principal da página. Aqui não há menu
         (<nav>) porque o servidor não sabe qual perfil está
         acessando; mostrar o menu do perfil errado confundiria
         o usuário. -->
    <main>

        <!-- Nome do sistema, para o usuário saber que continua no KFKA. -->
        <p>KFKA</p>

        <!-- Código do erro em destaque. Fica em <p> porque é uma
             informação complementar; o título da página é o <h1>
             logo abaixo. -->
        <p>Erro 404</p>

        <!-- <h1>: título principal. Diz o problema em linguagem
             simples, sem termos técnicos. -->
        <h1>Página não encontrada</h1>

        <!-- Explicação curta das causas mais prováveis. Uma boa
             página de erro diz O QUE aconteceu e O QUE FAZER. -->
        <p>O endereço que você tentou acessar não existe ou foi alterado. Confira se ele foi digitado corretamente.</p>

        <!-- Saída para o usuário não ficar "preso" na página de erro.
             Leva ao login porque, sem sessão, o servidor não sabe
             qual é o painel do usuário. Quando houver sessão (E2),
             este link poderá levar ao painel do perfil logado. -->
        <p><a href="/login.html">Voltar para o início</a></p>

    </main>

</body>
</html>
