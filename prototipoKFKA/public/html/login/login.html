<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KFKA - Acompanhamento Escolar</title>
</head>
<body>
    <main>
        <header>
            <h1>KFKA</h1>
            <p>Plataforma de Acompanhamento Escolar</p>
        </header>
        <!--Esse form é onde cria as lacunas para o usuário digitar, 
        coloquei esse novalidate no forms pra desligar a validação automática do navegador se o usuário não digitar nada aí não aparece aquele balão feio do navegador-->
        <form id="form-login" novalidate>
            <h2>Entrar</h2>
            <!--Essa div vai ser importante para o JavaScript mandar uma mensagem para o usuário caso erre senha ou email, já esse alert só serve para alertar algo importante na página
            -->
            <div id="mensagem-geral" role="alert" hidden></div>
            <!--Essa parte é o corpo para colocar o email-->
            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="seu.email@exemplo.com"
                    required
                    aria-describedby="erro-email"
                >
                <!--caso o uruário erro o email já tem uma mensagem pronta-->
                <span id="erro-email"></span>
            </div>
            <!--Essa parte é o corpo para colocar a senha, quase a mesma coisa-->
            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="current-password"
                    placeholder="sua melhor senha"
                    required
                    aria-describedby="erro-senha"
                >
                <!--caso o uruário erre a senha já tem uma mensagem pronta-->
                <span id="erro-senha"></span>
            </div>
            <button type="submit">Entrar</button>
        </form>

    </main>
</body>
</html>
