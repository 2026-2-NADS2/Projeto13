<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo NI1 - Sobrevivência Espacial</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            background-color: #000;
            border: 2px solid #fff;
        }
        #info {
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div>
        <div id="info">
            <h2>Sobrevivência Espacial</h2>
            <p>Use as setas Esquerda e Direita para mover. Evite os blocos vermelhos!</p>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Controlo de teclas
        const teclas = {};
        window.addEventListener('keydown', (e) => teclas[e.code] = true);
        window.addEventListener('keyup', (e) => teclas[e.code] = false);

        // ==========================================
        // 1. CLASSE BASE (Conceito de Classe e Objeto)
        // ==========================================
        class Entidade {
            constructor(x, y, largura, altura, cor) {
                this.x = x;
                this.y = y;
                this.largura = largura;
                this.altura = altura;
                this.cor = cor;
            }

            // Método comum para desenhar a entidade no canvas
            desenhar(ctx) {
                ctx.fillStyle = this.cor;
                ctx.fillRect(this.x, this.y, this.largura, this.altura);
            }

            // Método que será redefinido nas subclasses (preparação para Polimorfismo)
            atualizar() {
                // Comportamento base vazio
            }
        }

        // ==========================================
        // 2. HERANÇA E POLIMORFISMO (Jogador)
        // ==========================================
        class Jogador extends Entidade {
            constructor(x, y) {
                // Chama o construtor da classe pai (Entidade)
                super(x, y, 30, 30, '#00ffcc'); 
                this.velocidade = 5;
            }

            // POLIMORFISMO: Sobrescreve o método atualizar com o comportamento específico do jogador
            atualizar() {
                if (teclas['ArrowLeft'] && this.x > 0) {
                    this.x -= this.velocidade;
                }
                if (teclas['ArrowRight'] && this.x < canvas.width - this.largura) {
                    this.x += this.velocidade;
                }
            }
        }

        // ==========================================
        // 3. HERANÇA E POLIMORFISMO (Inimigo)
        // ==========================================
        class Inimigo extends Entidade {
            constructor(x, y, velocidade) {
                // Chama o construtor da classe pai (Entidade)
                super(x, y, 20, 20, '#ff3333');
                this.velocidade = velocidade;
            }

            // POLIMORFISMO: Sobrescreve o método atualizar com o comportamento específico do inimigo (cair)
            atualizar() {
                this.y += this.velocidade;
            }
        }

        // ==========================================
        // LÓGICA DO JOGO
        // ==========================================
        let jogador = new Jogador(canvas.width / 2 - 15, canvas.height - 40);
        let inimigos = [];
        let frameCount = 0;
        let jogoAtivo = true;

        function gerarInimigos() {
            if (frameCount % 60 === 0) {
                let xAleatorio = Math.random() * (canvas.width - 20);
                let velocidadeAleatoria = 2 + Math.random() * 3;
                inimigos.push(new Inimigo(xAleatorio, -20, velocidadeAleatoria));
            }
        }

        function verificarColisao(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.largura &&
                rect1.x + rect1.largura > rect2.x &&
                rect1.y < rect2.y + rect2.altura &&
                rect1.y + rect1.altura > rect2.y
            );
        }

        function loopJogo() {
            if (!jogoAtivo) {
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.fillText('FIM DE JOGO!', canvas.width / 2 - 100, canvas.height / 2);
                return;
            }

            // Limpa o ecrã
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Atualiza e desenha o jogador
            jogador.atualizar();
            jogador.desenhar(ctx);

            // Atualiza e desenha inimigos
            gerarInimigos();
            for (let i = 0; i < inimigos.length; i++) {
                inimigos[i].atualizar();
                inimigos[i].desenhar(ctx);

                // Verifica colisão
                if (verificarColisao(jogador, inimigos[i])) {
                    jogoAtivo = false;
                }

                // Remove inimigos que saíram do ecrã para limpar memória
                if (inimigos[i].y > canvas.height) {
                    inimigos.splice(i, 1);
                    i--;
                }
            }

            frameCount++;
            requestAnimationFrame(loopJogo);
        }

        // Inicia o jogo
        loopJogo();
    </script>
</body>
</html>
